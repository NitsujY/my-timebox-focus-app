# dash_35 device: classic ESP32 (not S3!) + ST7796 480x320 + FT6336.
# Pin map verified against esp32-drive-orbit/src/dash_35 (dashboard_display.cpp).
[env:dash_35]
platform = espressif32
board = esp32dev
; Prebuilt Arduino core (NOT arduino+espidf). The IDF-component path was tried
; to free IRAM for a DMA display driver, but IDF 4.4's toolchain puts so much in
; IRAM that even the plain (non-DMA) build overflowed iram0 by ~3.5KB — a dead
; end on this board. Prebuilt core + NimBLE + a lighter flush is the way.
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  https://github.com/moononournation/Arduino_GFX.git#v1.6.0  ; proven on dash_35
  bblanchon/ArduinoJson @ ^7.2.0
  h2zero/NimBLE-Arduino @ ^2.3.0  ; BLE — light ISRs, ~100KB less RAM than Bluedroid
build_flags =
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
