# dash_35 device: classic ESP32 (not S3!) + ST7796 480x320 + FT6336.
# Pin map verified against esp32-drive-orbit/src/dash_35 (dashboard_display.cpp).
[env:dash_35]
platform = espressif32
board = esp32dev
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  bblanchon/ArduinoJson @ ^7.2.0
build_flags =
  -D USER_SETUP_LOADED
  -D ST7796_DRIVER
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_MISO=19
  -D TFT_CS=5
  -D TFT_DC=27
  -D TFT_RST=-1   ; reset via TCA9554 expander pin 0, pulsed in setup()
  -D TFT_BL=25
  -D SPI_FREQUENCY=80000000
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
