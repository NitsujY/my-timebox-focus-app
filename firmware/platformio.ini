# dash_35 device: classic ESP32 (not S3!) + ST7796 480x320 + FT6336.
# Pin map verified against esp32-drive-orbit/src/dash_35 (dashboard_display.cpp).
[env:dash_35]
platform = espressif32
board = esp32dev
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  https://github.com/moononournation/Arduino_GFX.git#v1.6.0  ; proven on dash_35
  bblanchon/ArduinoJson @ ^7.2.0
  h2zero/NimBLE-Arduino @ ^2.3.0  ; BLE — ~100KB less RAM / far fewer ISRs than Bluedroid (was causing display flicker)
build_flags =
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  # NimBLE config: small footprint, no roles we don't use
  -D CONFIG_BT_NIMBLE_ENABLED=1
