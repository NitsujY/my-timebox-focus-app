[env:esp32-s3-touch-lcd-35]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_qspi   ; 2MB PSRAM
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  bblanchon/ArduinoJson @ ^7.2.0
# TFT_eSPI config (was User_Setup.h). Pins from the vendor demo
# (ESP32-S3-Touch-LCD-3.5-Demo.zip, 08_gfx_helloworld.ino).
build_flags =
  -D USER_SETUP_LOADED
  -D ST7796_DRIVER
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_MOSI=1
  -D TFT_SCLK=5
  -D TFT_MISO=2
  -D TFT_CS=-1    ; tied low on board
  -D TFT_DC=3
  -D TFT_RST=-1   ; reset via TCA9554 expander pin 1, pulsed in setup()
  -D TFT_BL=6
  -D SPI_FREQUENCY=40000000
