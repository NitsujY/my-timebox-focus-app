# dash_35 device: classic ESP32 (not S3!) + ST7796 480x320 + FT6336.
# Pin map verified against esp32-drive-orbit/src/dash_35 (dashboard_display.cpp).
[env:dash_35]
; Pinned: the pioarduino fork (IDF 5.x core) installed itself globally as
; "espressif32" during the DMA experiments and shadows the official platform.
; We want the official prebuilt core 2.0.17 (IDF 4.4) — with the radios gone
; it's the lightest thing that runs the polling SPI driver.
platform = espressif32@6.13.0
board = esp32dev
; Prebuilt Arduino core. No WiFi, no BLE — the app drives the device over USB
; serial, so the polling SPI driver has the CPU to itself. (The radio stacks
; were what tore frames / overflowed iram0 with the DMA driver; both the
; IDF-component and pioarduino/IDF5 paths were tried and abandoned.)
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  https://github.com/moononournation/Arduino_GFX.git#v1.6.0  ; proven on dash_35
  bblanchon/ArduinoJson @ ^7.2.0
build_flags =
  -D BOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
